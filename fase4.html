<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mistério — Fase 4</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

.container{
    width:700px;
    margin:50px auto;
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:12px;
    padding:35px;
    box-sizing:border-box;
    min-height:800px;
}

h1{
    text-align:center;
    letter-spacing:4px;
    margin-top:0;
}

.subtitulo{
    text-align:center;
    color:#bbb;
    margin-bottom:40px;
}

h2{
    border-bottom:1px solid #444;
    padding-bottom:10px;
}

p{
    font-size:17px;
}

.imagem{
    display:block;
    width:100%;
    max-width:600px;
    margin:30px auto;
    border-radius:8px;
}

.area{
    text-align:center;
    margin-top:30px;
}

input{
    width:400px;
    padding:13px;
    background:#0f0f0f;
    border:1px solid #555;
    border-radius:6px;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:12px;
    padding:12px 30px;
    border:0;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

#mensagem{
    margin-top:20px;
    font-weight:bold;
}

.final{
    text-align:center;
    color:#777;
    margin-top:35px;
}
</style>
</head>

<body>

<div class="container">

    <h1>MISTÉRIO</h1>

    <div class="subtitulo">
        FASE 4 — AS CADEIRAS
    </div>

    <p>
        Observe atentamente a imagem abaixo.
    </p>

    <p>
        Existe uma lógica por trás dos números.
    </p>

    <img src="fase4.png" class="imagem">

    <div class="area">

        <h2>🔒 RESPOSTA</h2>

        <p>Digite a resposta encontrada:</p>

        <input
            type="text"
            id="resposta"
            placeholder="Digite a resposta..."
        >

        <br>

        <button onclick="verificar()">CONTINUAR</button>

        <div id="mensagem"></div>

    </div>

    <div class="final">
        FASE 4 DE 25
    </div>

</div>

<script>

function verificar(){

    let resposta =
        document.getElementById("resposta").value.trim();

    if(resposta === "12"){

        document.getElementById("mensagem").innerHTML =
            "Resposta correta.";

        setTimeout(function(){

            window.location.href = "fase5.html";

        },1000);

    }else{

        document.getElementById("mensagem").innerHTML =
            "Resposta incorreta.";

    }

}

</script>

</body>
</html>

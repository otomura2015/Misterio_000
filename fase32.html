<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fase 32</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0d0d0d;
        color: #e8e8e8;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-top: 52px;
    }

    h1 {
        margin: 0 0 14px;
        font-size: 30px;
        letter-spacing: 7px;
        font-weight: bold;
    }

    .numero {
        color: #dcdcdc;
    }

    .descricao {
        color: #999;
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 42px;
    }

    .video-box {
        width: 720px;
        max-width: 90%;
        margin: 0 auto;
    }

    .video {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #3b3b3b;
        background: #111;
    }

    .video-link {
        display: inline-block;
        margin-top: 25px;
        padding: 13px 28px;
        border: 1px solid #555;
        color: #ddd;
        text-decoration: none;
        font-size: 14px;
    }

    .video-link:hover {
        background: #181818;
        border-color: #888;
    }
</style>
</head>

<body>

<div class="container">

    <h1>FASE <span class="numero">32</span></h1>

    <div class="descricao">
        Assista ao vídeo.
    </div>

    <div class="video-box">

        <iframe
            class="video"
            src="https://www.youtube.com/embed/rLWaXbMmRmo"
            title="Vídeo da Fase 32"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <a
            class="video-link"
            href="https://youtu.be/rLWaXbMmRmo"
            target="_blank">
            ABRIR VÍDEO
        </a>

    </div>

</div>

</body>
</html>

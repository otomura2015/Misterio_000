<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CASO Nº 31001</title>

    <style>
        body {
            margin: 0;
            background: #101010;
            color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 35px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .descricao {
            color: #999;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .imagens {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .evidencia {
            width: 170px;
            height: 170px;
            border: 1px solid #444;
            background: #171717;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .evidencia:hover {
            border-color: #777;
        }

        .evidencia img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        input {
            width: 260px;
            height: 45px;
            background: #171717;
            border: 1px solid #555;
            color: #ddd;
            text-align: center;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #777;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 12px 25px;
            background: #171717;
            color: #eee;
            border: 1px solid #555;
            cursor: pointer;
        }

        button:hover {
            border-color: #aaa;
        }

        #resultado {
            margin-top: 20px;
            min-height: 30px;
            font-size: 16px;
        }

        .pista {
            color: #777;
            margin-top: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CASO Nº 31001</h1>

    <div class="descricao">
        Cinco imagens foram encontradas durante a investigação.<br>
        Existem informações escondidas entre as evidências.<br>
        Analise todas elas e descubra a cidade.
    </div>

    <div class="imagens">

        <div class="evidencia">
            <img src="image_1.png" alt="Evidência 1">
        </div>

        <div class="evidencia">
            <img src="image_2.png" alt="Evidência 2">
        </div>

        <div class="evidencia">
            <img src="image_3.png" alt="Evidência 3">
        </div>

        <div class="evidencia">
            <img src="image_4.png" alt="Evidência 4">
        </div>

        <div class="evidencia">
            <img src="image.png" alt="Evidência 5">
        </div>

    </div>

    <h2>QUAL É A CIDADE?</h2>

    <input
        type="text"
        id="resposta"
        placeholder="Digite a cidade"
        autocomplete="off"
    >

    <button onclick="verificar()">
        CONFIRMAR
    </button>

    <div id="resultado"></div>

    <div class="pista">
        Existem informações que não estão imediatamente visíveis.
    </div>

    <!-- COORDENADA DA INVESTIGAÇÃO
         -23.537515343168245, -47.458442906970674
    -->

</div>

<script>

function verificar() {

    let resposta = document
        .getElementById("resposta")
        .value
        .trim()
        .toLowerCase();

    let resultado = document.getElementById("resultado");

    if (resposta === "") {

        resultado.innerHTML = "Digite uma resposta.";
        resultado.style.color = "#999";

        return;
    }

    if (resposta === "votorantim") {

        resultado.innerHTML = "RESPOSTA CORRETA.";
        resultado.style.color = "#dcdcdc";

        // Depois de 1,2 segundos, vai para a fase 32
        setTimeout(function() {
            window.location.href = "fase32.html";
        }, 1200);

    } else {

        resultado.innerHTML = "RESPOSTA INCORRETA.";
        resultado.style.color = "#888";

    }
}

</script>

</body>
</html>

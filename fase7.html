<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 7</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        img {
            width: 450px;
            max-width: 85vw;
            display: block;
            margin: 0 auto 30px;
        }

        h1 {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        input {
            width: 120px;
            padding: 12px;

            background: #111;
            color: white;

            border: 1px solid #555;

            text-align: center;
            font-size: 20px;

            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;

            background: #111;
            color: white;

            border: 1px solid #555;

            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #222;
        }

        #resultado {
            margin-top: 25px;
            min-height: 30px;
            font-size: 18px;
        }

        #continuar {
            display: none;
            margin: 25px auto 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="dentadura.jpg" alt="Imagem">

        <h1>QUAL FASE?</h1>

        <input
            type="number"
            id="resposta"
            placeholder="?"
        >

        <button onclick="verificar()">
            CONFIRMAR
        </button>

        <div id="resultado"></div>

        <button id="continuar" onclick="irParaFase8()">
            CONTINUAR
        </button>

    </div>

    <script>

        // COLOQUE AQUI O NÚMERO DA FASE
        // EM QUE A DENTADURA APARECEU
        const faseCorreta = 2;


        function verificar() {

            const resposta =
                Number(document.getElementById("resposta").value);

            const resultado =
                document.getElementById("resultado");

            if (resposta === faseCorreta) {

                resultado.innerHTML =
                    "CORRETO.<br><br>Você se lembrou.";

                document.getElementById("continuar").style.display =
                    "block";

            } else {

                resultado.innerHTML =
                    "ERRADO.<br><br>Você já viu essa imagem antes.";

            }
        }


        function irParaFase8() {

            window.location.href = "fase8.html";

        }

    </script>

</body>
</html>
